[package]
authors = ["Paxon Qiao <qiaopengjun0@gmail.com>"]
description = "Kite x402 service template (Rust + Axum) — wraps any HTTP API behind x402 payments on the Kite chain"
edition = "2024"
keywords = ["kite", "x402", "axum", "payment", "stablecoin"]
license = "MIT"
name = "kite-rust-axum-template"
repository = "https://github.com/qiaopengjun5162/kite-rust-axum-template"
version = "0.1.1"

[dependencies]
# x402 protocol
x402-axum = "2.0.2"
x402-chain-eip155 = { version = "2.0.2", features = ["server"] }
x402-types = "2.0.2"
# Web framework
axum = "0.8"
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# HTTP client for proxy
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async runtime
tokio = { version = "1", features = ["full"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Env file loading
dotenvy = "0.15"

[dev-dependencies]
hyper = "1"
